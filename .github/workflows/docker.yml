name: docker

# Build the FAR-LIO container image and publish it to the GitHub Container
# Registry (GHCR).
#
#   * push to main    -> push  <image>:latest  and  <image>:latest_deps
#   * published release-> push  <image>:<tag>   (e.g. v1.2.3)
#   * pull request     -> build only (no push), to verify the image still builds
#

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Derive tags for the final image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=pr

      # deps stage: shared dependency layer. Pushed as :latest_deps on main
      # pushes; on other events it is only built (and cached) as the base for
      # the final image.
      - name: Build (and push on main) the deps stage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: deps
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.img.outputs.name }}:latest_deps
          cache-from: type=gha,scope=deps
          cache-to: type=gha,mode=max,scope=deps
          provenance: false

      # Final image: slim runtime stage (compiled workspace copied onto a CUDA
      # runtime base). Pushed on main (:latest) and on releases (:<tag>); only
      # built on pull requests. Built for the Ada/Blackwell CUDA
      # architectures (89;120).
      - name: Build (and push) the final image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_CUDA=ON
            CUDA_ARCHITECTURES=89;120
          cache-from: |
            type=gha,scope=deps
            type=gha,scope=build
          cache-to: type=gha,mode=max,scope=build
          provenance: false
