name: docs

# Build the FAR-LIO documentation (Zensical site + Doxygen C++ API) and deploy
# it to the `gh-pages` branch.
#
#   * push to main -> build + deploy to the gh-pages branch
#   * pull request -> build only, so doc/config changes are verified before merge
#
# The workflow runs whenever the documentation sources or their build
# configuration change (docs/, zensical.toml, or this workflow itself). To also
# refresh the Doxygen API on code changes, add `ros_packages/**` and `lib_cpp/**`
# to the path filters below.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - zensical.toml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - zensical.toml
      - .github/workflows/docs.yml

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the built site to the gh-pages branch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Zensical
        run: pip install zensical

      - name: Build C++ API (Doxygen)
        working-directory: docs
        run: doxygen Doxyfile

      - name: Build site (Zensical)
        run: zensical build --clean

      - name: Deploy to gh-pages branch
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
