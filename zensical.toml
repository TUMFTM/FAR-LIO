# =============================================================================
# Zensical configuration for the FAR-LIO documentation.
#
# The Markdown sources live in docs/ and the C++ API reference is generated by
# Doxygen into docs/docs_cpp/ (see docs/Doxyfile). Because the Doxygen output
# lives inside docs_dir, Zensical copies it verbatim into site/docs_cpp/, i.e.
# to the top level of the built site, where the "C++ API" nav entry links to it.
#
# Build locally with:   make -C docs all       (Doxygen + Zensical)
# or directly with:      doxygen docs/Doxyfile && zensical build
# =============================================================================

[project]
site_name = "FAR-LIO"
use_directory_urls = false
site_description = "A highly efficient, CUDA-accelerated framework for Fast, Accurate, and Robust LiDAR-Inertial Odometry."
site_author = "TUM Autonomous Motorsport"
site_url = "https://tumftm.github.io/FAR-LIO/"
repo_url = "https://github.com/TUMFTM/FAR-LIO"
repo_name = "TUMFTM/FAR-LIO"
copyright = """
Copyright &copy; 2026 TUM Autonomous Motorsport
"""

# Navigation mirrors the structure of docs/. The final entry links to the
# Doxygen-generated C++ API, which is served at the site root (docs_cpp/).
nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "Configuration" = "configuration.md" },
  { "Analysis" = "analysis.md" },
  { "Applications" = "applications.md" },
  { "Detailed Documentation" = [
    { "C++ Libraries" = [
      { "Odometry (odometry_cpp)" = [
        "lib_cpp/odometry_cpp.md",
        "lib_cpp/odometry_cpp/odometry_base.md",
        "lib_cpp/odometry_cpp/odometry_types.md",
        "lib_cpp/odometry_cpp/odometry_utils.md",
        "lib_cpp/odometry_cpp/odometry_cuda_utils.md",
        "lib_cpp/odometry_cpp/covariance_handler.md",
        "lib_cpp/odometry_cpp/diagnostic_handler.md",
        "lib_cpp/odometry_cpp/distortion_handler.md",
        "lib_cpp/odometry_cpp/map_handler.md",
        "lib_cpp/odometry_cpp/model_handler.md",
        "lib_cpp/odometry_cpp/preprocessing_handler.md",
        "lib_cpp/odometry_cpp/registration_handler.md",
        "lib_cpp/odometry_cpp/robust_kernel.md",
        "lib_cpp/odometry_cpp/threshold_handler.md",
        "lib_cpp/odometry_cpp/velocity_handler.md",
        "lib_cpp/odometry_cpp/voxel_tools.md",
        "lib_cpp/odometry_cpp/odometry_pipeline.md",
      ] },
      { "State Estimation (state_estimation_cpp)" = [
        "lib_cpp/state_estimation_cpp.md",
        "lib_cpp/state_estimation_cpp/state_estimation_base.md",
        "lib_cpp/state_estimation_cpp/state_estimation_constants.md",
        "lib_cpp/state_estimation_cpp/tam_state_estimation.md",
      ] },
    ] },
    { "ROS 2 Packages" = [
      "ros_packages/tam_odometry.md",
      "ros_packages/tam_state_estimation_node.md",
    ] },
    { "C++ API" = "docs_cpp/index.html" },
  ] },
]

# Math support: arithmatex (generic) renders to MathJax, loaded below.
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

# -----------------------------------------------------------------------------
[project.theme]
language = "en"
logo = "assets/farlio-favicon.svg"
favicon = "assets/farlio-favicon.svg"
features = [
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

# The first palette is the default on load -> slate (dark) is the default.
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# -----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
